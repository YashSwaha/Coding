<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Practical 5: Bootstrap Student Registration</title>

  <!-- =====================================================================
       1. BOOTSTRAP ONLINE CDN
       Requires an active internet connection to load.
       ===================================================================== -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- =====================================================================
       2. BOOTSTRAP OFFLINE USAGE INSTRUCTIONS:
       To run without internet connection:
       Step a: Download compiled files from https://getbootstrap.com
       Step b: Place 'bootstrap.min.css' and 'bootstrap.bundle.min.js' in this folder.
       Step c: Comment out the CDN <link> above and replace with:
               <link rel="stylesheet" href="bootstrap.min.css">
       Step d: Replace the bottom CDN <script> with:
               <script src="bootstrap.bundle.min.js"></script>
       ===================================================================== -->
</head>
<body class="bg-light">

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-7 col-lg-6">

        <!-- Instructions Card: CDN vs Offline -->
        <div class="card mb-4 border-info">
          <div class="card-header bg-info text-white fw-bold">
            Bootstrap Usage Notes (CDN &amp; Offline)
          </div>
          <div class="card-body">
            <p class="card-text mb-1"><strong>Online CDN:</strong> Currently loaded via jsDelivr CDN.</p>
            <p class="card-text mb-0"><strong>Offline Setup:</strong> Download <code>bootstrap.min.css</code> &amp; <code>bootstrap.bundle.min.js</code> into this folder, then replace CDN links with local file paths.</p>
          </div>
        </div>

        <!-- 3. Student Registration Form -->
        <div class="card shadow-sm">
          <div class="card-header bg-primary text-white text-center py-3">
            <h3 class="mb-0">Student Registration Form</h3>
          </div>
          <div class="card-body p-4">
            <form id="regForm" onsubmit="handleRegistration(event)">

              <!-- Roll Number -->
              <div class="mb-3">
                <label for="rollNo" class="form-label fw-semibold">Roll Number</label>
                <input type="text" class="form-control" id="rollNo" placeholder="Enter Roll Number (e.g., 24CS101)" required>
              </div>

              <!-- First Name -->
              <div class="mb-3">
                <label for="firstName" class="form-label fw-semibold">First Name</label>
                <input type="text" class="form-control" id="firstName" placeholder="Enter First Name" required>
              </div>

              <!-- Mobile Number -->
              <div class="mb-3">
                <label for="mobileNo" class="form-label fw-semibold">Mobile Number</label>
                <input type="tel" class="form-control" id="mobileNo" pattern="[0-9]{10}" placeholder="10-digit Mobile Number" required>
              </div>

              <!-- Email ID -->
              <div class="mb-3">
                <label for="email" class="form-label fw-semibold">Email ID</label>
                <input type="email" class="form-control" id="email" placeholder="student@example.com" required>
              </div>

              <!-- Address -->
              <div class="mb-3">
                <label for="address" class="form-label fw-semibold">Address</label>
                <textarea class="form-control" id="address" rows="3" placeholder="Enter complete residential address" required></textarea>
              </div>

              <!-- Submit Button -->
              <div class="d-grid mt-4">
                <button type="submit" class="btn btn-primary btn-lg">Register Student</button>
              </div>

            </form>

            <div id="submitResult" class="alert alert-success mt-3 d-none"></div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- Bootstrap 5 JavaScript Bundle with Popper (Online CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    function handleRegistration(event) {
      event.preventDefault();
      const rollNo = document.getElementById('rollNo').value;
      const firstName = document.getElementById('firstName').value;
      const resultDiv = document.getElementById('submitResult');

      resultDiv.classList.remove('d-none');
      resultDiv.innerHTML = `Registration successful for <strong>${firstName}</strong> (Roll: ${rollNo})!`;
    }
  </script>

</body>
</html>
